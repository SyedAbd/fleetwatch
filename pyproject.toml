[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetwatch"
version = "1.1.0"
description = "Self-hosted monitoring for GPU servers and ordinary machines: agents, a collector, alerting and a live dashboard, with no dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["monitoring", "gpu", "nvidia", "xid", "alerting", "observability", "fleet", "prometheus"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Hardware",
]

[project.scripts]
fleetwatch = "fleetwatch.cli:main"

[tool.setuptools]
packages = ["fleetwatch"]

[tool.setuptools.package-data]
fleetwatch = ["dashboard.html"]
